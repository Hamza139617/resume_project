<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paidagogos</title>

    <meta name="viewport" content="width=device-width, intitial-scale=1.0" />
    <meta
      name="description"
      content="this is the best software for education"
    />
    <link rel="stylesheet" href="../Css/output.css" />
    <link rel="icon" type="image/svg+xml" href="../Assets/favicon_3.png" />
  </head>
  <body class="bg-b-navy text-body-text antialiased overflow-x-hidden">
    <header class="fixed top-0 left-0 right-0 z-50">
      <nav class="max-w-7xl mx-auto px-5 sm:px-8 lg:px-10 pt-5">
        <div
          class="flex items-center justify-between h-16 px-4 sm:px-6 bg-primary/80 backdrop-blur-xl border border-teal/10 rounded-2xl"
        >
          <a href="" class="flex items-center gap-3">
            <div class="w-9 h-9 sm:w-10 sm:h-10">
              <img
                src="../Assets/logo.svg"
                alt="Paidagogos logo"
                class="w-full h-full"
              />
            </div>

            <span
              class="text-body-text font-semibold text-base sm:text-lg tracking-tight"
            >
              Paidagogos
            </span>
          </a>

          <div class="hidden md:flex items-center gap-8">
            <a
              href="../index.html"
              class="text-secondary-text hover:text-body-text text-sm transition-colors"
            >
              Home
            </a>
            <a
              href="chat.html"
              class="text-secondary-text hover:text-body-text text-sm transition-colors"
            >
              Chat
            </a>
            <a
              href="history.html"
              class="text-secondary-text hover:text-body-text text-sm transition-colors"
            >
              History
            </a>
          </div>

          <a
            href=""
            class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-lg bg-mint text-b-navy text-sm font-semibold hover:bg-teal hover:text-body-text transition-all duration-200"
          >
            Sign up

            <svg
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 12h14M13 6l6 6-6 6"
              />
            </svg>
          </a>

          <button
            id="mobileMenuButton"
            class="md:hidden p-2 text-secondary-text hover:text-body-text"
            aria-label="Open menu"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>

        <div
          id="mobileMenu"
          class="hidden md:hidden mt-2 p-4 bg-primary border border-teal/10 rounded-2xl"
        >
          <div class="flex flex-col gap-2">


            <a
              href="../index.html"
              class="px-4 py-3 rounded-lg text-secondary-text hover:text-body-text hover:bg-teal/10 transition"
            >
              Home
            </a>

            <a
              href="chat.html"
              class="px-4 py-3 rounded-lg text-secondary-text hover:text-body-text hover:bg-teal/10 transition"
            >
              Chat
            </a>

            <a
              href="history.html"
              class="px-4 py-3 rounded-lg text-secondary-text hover:text-body-text hover:bg-teal/10 transition"
            >
              History
            </a>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="bg-gray-50 dark:bg-gray-900">
        <div
          class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0"
        >
          <div
            class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700"
          >
            <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1
                class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white"
              >
                Create an account
              </h1>
              <form class="space-y-4 md:space-y-6" action="#">
                <div>
                  <label
                    for="email"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Your email</label
                  >
                  <input
                    type="email"
                    name="email"
                    id="email"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="name@company.com"
                    required=""
                  />
                </div>
                <div>
                  <label
                    for="password"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Password</label
                  >
                  <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="••••••••"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    required=""
                  />
                </div>
                <div>
                  <label
                    for="confirm-password"
                    class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                    >Confirm password</label
                  >
                  <input
                    type="confirm-password"
                    name="confirm-password"
                    id="confirm-password"
                    placeholder="••••••••"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    required=""
                  />
                </div>
                <div class="flex items-start">
                  <div class="flex items-center h-5">
                    <input
                      id="terms"
                      aria-describedby="terms"
                      type="checkbox"
                      class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800"
                      required=""
                    />
                  </div>
                  <div class="ml-3 text-sm">
                    <label
                      for="terms"
                      class="font-light text-gray-500 dark:text-gray-300"
                      >I accept the
                      <a
                        class="font-medium text-primary-600 hover:underline dark:text-primary-500"
                        href="#"
                        >Terms and Conditions</a
                      ></label
                    >
                  </div>
                </div>
                <div class="flex flex-row justify-center">
                  <button
                    type="submit"
                    class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3.5 rounded-xl border border-teal/20 bg-primary/50 text-body-text font-medium text-sm hover:bg-teal/10 hover:border-teal/40 transition-all duration-200"
                  >
                    Create an account
                  </button>
                </div>
                <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                  Already have an account?
                  <a
                    href="#"
                    class="font-medium text-primary-600 hover:underline dark:text-primary-500"
                    >Login here</a
                  >
                </p>
              </form>
            </div>
          </div>
        </div>
      </section>
      <article></article>
      <aside></aside>
    </main>
    <footer class="border-t border-teal/10">
      <div class="max-w-7xl mx-auto px-5 sm:px-8 lg:px-10 py-8">
        <div
          class="flex flex-col sm:flex-row items-center justify-between gap-4"
        >
          <div class="flex items-center gap-2">
            <div class="w-7 h-7">
              <img
                src="../Assets/logo.svg"
                alt="Paidagogos"
                class="w-full h-full"
              />
            </div>

            <span class="text-sm font-semibold"> Paidagogos </span>
          </div>

          <p class="text-xs text-secondary-text">
            Learn with curiosity. Grow with confidence.
          </p>

          <p class="text-xs text-secondary-text">© 2026 Paidagogos</p>
        </div>
      </div>
    </footer>
    <script>
      const mobileMenuButton = document.getElementById("mobileMenuButton");

      const mobileMenu = document.getElementById("mobileMenu");

      mobileMenuButton.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
      });

      document.querySelectorAll("#mobileMenu a").forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.add("hidden");
        });
      });
    </script>
  </body>
</html>
