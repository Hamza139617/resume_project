<section class="w-full text-body-text">
    <div class="w-full max-w-4xl mx-auto px-5 sm:px-8 py-12">

        <!-- Heading -->
        <h1
            class="text-center text-4xl sm:text-5xl md:text-6xl
                   font-semibold tracking-tight leading-[1.05]
                   text-mint"
        >
            Chat History
        </h1>

   
        <div class="w-[80%] max-w-2xl ml-16 mx-auto mt-8">
            <form
                class="group flex items-center gap-2
                       bg-primary/80 backdrop-blur-xl
                       border border-teal/20
                       rounded-2xl p-1
                       transition-all duration-300
                       hover:border-teal/35
                       focus-within:border-mint/50
                       focus-within:shadow-[0_0_0_4px_rgba(33,230,193,0.08)]"
            >

                <!-- Search icon -->
                <div class="pl-3 text-secondary-text shrink-0">
                    <svg
                        class="w-5 h-5  transition-colors group-focus-within:text-mint"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="1.7"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
                        />
                    </svg>
                </div>

             
                <input
                    type="text"
                    placeholder="Search your conversations..."
                    class="flex-1 min-w-0 bg-transparent px-2 py-3
                           text-sm sm:text-base
                           text-body-text
                           placeholder:text-secondary-text
                           outline-none"
                />

               
                <button
                    type="submit"
                    aria-label="Search chat history"
                    class="w-10 h-10 sm:w-11 sm:h-11
                           shrink-0 rounded-xl
                           bg-mint text-b-navy
                           flex items-center justify-center
                           transition-all duration-200
                           hover:bg-teal hover:text-body-text
                           active:scale-95"
                >
                    <svg
                        class="w-4 h-4 sm:w-5 sm:h-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
                        />
                    </svg>
                </button>

            </form>
        </div>

    </div>
